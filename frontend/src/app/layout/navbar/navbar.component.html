<header class="topbar">
  <div class="topbar-left">
    <button class="menu-button" type="button" (click)="sidebarToggle.emit()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="search-box" [class.search-box--open]="showSearchPanel">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"></path>
      </svg>
      <input
        type="search"
        placeholder="Search products, SKUs, or categories..."
        [(ngModel)]="searchQuery"
        (focus)="openSearch()"
        (blur)="closeSearch()"
        (keydown.enter)="runSearch()">

      <div class="search-results" *ngIf="showSearchPanel">
        <button
          type="button"
          class="search-result"
          *ngFor="let result of filteredSearchResults"
          (mousedown)="goToResult(result.route)">
          <strong>{{ result.label }}</strong>
          <span>{{ result.description }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="topbar-right">
    <button class="top-icon info" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>
    <button class="top-icon" type="button" aria-label="Theme" (click)="themeToggle.emit()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 7.5A9 9 0 1 1 12 3Z"></path>
      </svg>
    </button>
    <div class="store-meta">
      <strong>Main Store</strong>
      <span>Nairobi Central</span>
    </div>

    <div class="user-menu" (click)="userMenuToggle.emit()">
      <img src="https://ui-avatars.com/api/?name=User&background=dde3ea&color=2f3a45" alt="User">
      <div class="dropdown-menu dropdown-menu-end" [ngClass]="{ show: userMenuOpen }">
        <span class="dropdown-header">{{ userEmail }}</span>
        <a routerLink="/utilisateurs" class="dropdown-item">Utilisateurs</a>
        <div class="dropdown-divider"></div>
        <button type="button" class="dropdown-item text-danger" (click)="$event.stopPropagation(); logoutClick.emit()">Se deconnecter</button>
      </div>
    </div>
  </div>
</header>
