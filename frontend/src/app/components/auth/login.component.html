<main class="login-shell">
  <section class="login-card">
    <div class="brand">
      <span class="brand-mark">S</span>
      <div>
        <h1>Sales ERP</h1>
        <p>Administration commerciale</p>
      </div>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" class="form-control" formControlName="email" placeholder="admin@sales.local">
        <small *ngIf="hasError('email')" class="text-danger">Email valide obligatoire.</small>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Mot de passe</label>
        <div class="password-row">
          <input id="password" [type]="showPassword ? 'text' : 'password'" class="form-control" formControlName="password">
          <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()">
            {{ showPassword ? 'Masquer' : 'Voir' }}
          </button>
        </div>
        <small *ngIf="hasError('password')" class="text-danger">Mot de passe obligatoire.</small>
      </div>

      <label class="form-check mb-4">
        <input type="checkbox" class="form-check-input" formControlName="rememberMe">
        <span class="form-check-label">Se souvenir de moi</span>
      </label>

      <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </section>
</main>
